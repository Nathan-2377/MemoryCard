<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>

<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>

  <section class="header">
    <h1>Jogo da memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">

    <!-- Início das seções dos cards - 12 cards (cartões) -->

    <section class="memory-card" data-framework="brasileirao">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/brasileirao.png" alt="Brasileirão" />
    </section>

    <section class="memory-card" data-framework="cbf">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/cbf.png" alt="CBF Brasil" />
    </section>

    <section class="memory-card" data-framework="copa_ouro">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/copa_ouro.png" alt="Copa Ouro" />
    </section>

    <section class="memory-card" data-framework="champions">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/champions.png" alt="Champions League" />
    </section>

    <section class="memory-card" data-framework="libertadores">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/libertadores.png" alt="Libertadores" />
    </section>

    <section class="memory-card" data-framework="copa_mundo">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/copa_mundo.png" alt="Copa do Mundo" />
    </section>

    <section class="memory-card" data-framework="copa_mundo">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/copa_mundo.png" alt="Copa do Mundo" />
    </section>

    <section class="memory-card" data-framework="libertadores">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/libertadores.png" alt="Libertadores" />
    </section>

    <section class="memory-card" data-framework="champions">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/champions.png" alt="Champions League" />
    </section>

    <section class="memory-card" data-framework="copa_ouro">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/copa_ouro.png" alt="Copa Ouro" />
    </section>

    <section class="memory-card" data-framework="cbf">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/cbf.png" alt="CBF Brasil" />
    </section>

    <section class="memory-card" data-framework="brasileirao">
      <img class="front-face" src="img/pergunta.png" alt="Carta fechada" />
      <img class="back-face" src="img/brasileirao.png" alt="Brasileirão" />
    </section>

    <!-- Fim das seções dos cards -->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript -->
  <script src="js/scrypt.js"></script>

</body>

</html>
